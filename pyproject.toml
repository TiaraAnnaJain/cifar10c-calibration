[project]
name = "cifar10c-calibration"
version = "0.1.0"
description = "Accuracy and calibration of CIFAR-10 classifiers under distribution shift (CIFAR-10-C)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"